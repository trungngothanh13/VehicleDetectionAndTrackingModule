# BoT-SORT Tracker Configuration
# Combines motion estimation, Global Motion Compensation (GMC), and low-confidence recovery

tracker_type: botsort

# =========================================================================
# ReID TOGGLE (Disabled for speed)
# Set to 'false' for fast motion + GMC tracking (no ReID model pass).
# Set to 'true' to enable appearance feature embeddings.
# =========================================================================
with_reid: false

# Tracking parameters (Ultralytics defaults)
track_high_thresh: 0.25  # First-stage match threshold (higher = cleaner, lower = more tracks)
track_low_thresh: 0.1    # Second-stage match threshold for low-score recovery
new_track_thresh: 0.25   # Min confidence to initialize a new track
track_buffer: 30         # Frames to keep lost tracks alive
match_thresh: 0.8        # Association similarity threshold (0.8 = standard lenient matching)
fuse_score: true         # Fuse detection confidence with motion score for matching

# Global Motion Compensation (GMC for camera sway/vibration)
gmc_method: sparseOptFlow  # Options: sparseOptFlow | orb | sift | ecc | none

# Appearance ReID settings (only active when with_reid: true)
proximity_thresh: 0.5    # Min IoU to consider tracks proximate for ReID
appearance_thresh: 0.8   # Min appearance similarity for ReID matching
model: auto              # ReID model path or "auto"
